name: Keep backend awake

on:
  schedule:
    # Every 10 minutes (GitHub may delay scheduled runs by a few minutes)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping /health
        env:
          # Set under Settings > Secrets and variables > Actions > Variables
          # e.g. https://your-app.up.railway.app
          ROOM_SERVER_URL: ${{ vars.ROOM_SERVER_URL }}
        run: |
          if [ -z "$ROOM_SERVER_URL" ]; then
            echo "ROOM_SERVER_URL variable is not set"; exit 1
          fi
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --max-time 60 "${ROOM_SERVER_URL%/}/health"
