name: Keep backend awake

on:
  schedule:
    # Every 10 minutes (GitHub may delay scheduled runs by a few minutes)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --max-time 90 https://lagos-racer-server.onrender.com/health
